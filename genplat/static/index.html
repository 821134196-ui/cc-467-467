<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备用发电机试运行与燃油补给平台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M12 2 3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M7 12.5h3v4H7zM14 8h3v8.5h-3z" fill="currentColor"/>
    </svg>
    <div>
      <div class="brand-title">备用发电机运维平台</div>
      <div class="brand-sub">试运行 · 燃油补给 · 维修封锁</div>
    </div>
  </div>
  <nav class="mainnav" id="mainnav">
    <a href="#/units" data-view="units">机组总览</a>
    <a href="#/calendar" data-view="calendar">试运行日历</a>
    <a href="#/run" data-view="run">步骤执行</a>
    <a href="#/trends" data-view="trends">参数趋势</a>
    <a href="#/faults" data-view="faults">故障停机</a>
    <a href="#/fuel" data-view="fuel">燃油台账</a>
    <a href="#/approvals" data-view="approvals">审批记录</a>
  </nav>
  <div class="topright">
    <button class="bell" id="bellBtn" title="到期 / 低油位提醒">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 2a6 6 0 0 0-6 6v3.5L4 15h16l-2-3.5V8a6 6 0 0 0-6-6z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span class="bell-dot" id="bellDot" hidden></span>
    </button>
    <label class="identity">
      <span class="identity-label">当前身份</span>
      <select id="userSelect"></select>
    </label>
  </div>
</header>

<div class="alertbar" id="alertBar" hidden></div>

<main id="view" class="view" aria-live="polite"></main>

<footer class="footer">
  <span>模拟数据 · SQLite 持久化运行事件 · 附件存放于本地 <code>attachments/</code></span>
  <span id="simState"></span>
</footer>

<div class="modal-layer" id="modalLayer" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
</div>

<div class="toast-layer" id="toastLayer"></div>

<script src="/app.js"></script>
</body>
</html>
